<!doctype html>
<!-- PROTOTYPE, throw away: three looks for the Sidearc side panel, switchable via ?variant=A|B|C. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidearc prototypes</title>
<style>
  :root {
    --chrome-frame: #dfe3e9; --chrome-tab: #ffffff; --chrome-text: #1f1f1f; --chrome-muted: #5f6368;
    --page-bg: #ffffff; --page-line: #e8eaed;
    --g-blue: #1a73e8; --g-orange: #e8710a; --g-green: #188038; --g-pink: #d01884;
  }
  :root[data-theme="dark"] {
    --chrome-frame: #202124; --chrome-tab: #35363a; --chrome-text: #e8eaed; --chrome-muted: #9aa0a6;
    --page-bg: #292a2d; --page-line: #3c4043;
    --g-blue: #8ab4f8; --g-orange: #fcad70; --g-green: #81c995; --g-pink: #ff8bcb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--chrome-text); background: var(--chrome-frame); }

  /* Mock Chrome window: tab strip, toolbar, side panel on the left, page. */
  .window { display: grid; grid-template-rows: 40px 40px 1fr; height: 100vh; }
  .strip { display: flex; align-items: flex-end; gap: 2px; padding: 0 8px 0 76px; position: relative; overflow: hidden; }
  .stab { flex-shrink: 1; min-width: 0; }
  .strip::before { content: ""; position: absolute; left: 14px; top: 14px; width: 52px; height: 12px;
    background: radial-gradient(circle at 6px 6px, #ff5f57 5px, transparent 6px), radial-gradient(circle at 26px 6px, #febc2e 5px, transparent 6px), radial-gradient(circle at 46px 6px, #28c840 5px, transparent 6px); }
  .stab { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; width: 150px; border-radius: 8px 8px 0 0; color: var(--chrome-muted); font-size: 12px; white-space: nowrap; overflow: hidden; }
  .stab.active { background: var(--chrome-tab); color: var(--chrome-text); }
  .stab .chip { padding: 2px 8px; border-radius: 6px; color: #fff; font-weight: 600; font-size: 11px; }
  .toolbar { background: var(--chrome-tab); display: flex; align-items: center; gap: 10px; padding: 0 10px; }
  .omnibox { flex: 1; height: 30px; border-radius: 15px; background: var(--chrome-frame); display: flex; align-items: center; padding: 0 14px; color: var(--chrome-muted); }
  .main { display: flex; min-height: 0; background: var(--chrome-tab); }
  .panel-shell { width: 320px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--page-line); min-height: 0; }
  .panel-head { height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; color: var(--chrome-muted); font-size: 12px; flex: none; }
  .panel-body { flex: 1; overflow: auto; min-height: 0; }
  .page { flex: 1; margin: 0 8px 8px 0; border-radius: 8px; background: var(--page-bg); padding: 32px; color: var(--chrome-muted); }
  .page h1 { color: var(--chrome-text); font-size: 22px; margin: 0 0 10px; }
  .page .line { height: 10px; background: var(--page-line); border-radius: 5px; margin: 12px 0; }

  .fav { display: inline-grid; place-items: center; color: #fff; font-weight: 700; flex: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }

  /* Switcher: deliberately not part of the evaluated design. */
  .switcher { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px;
    background: #111; color: #fff; padding: 8px 12px; border-radius: 999px; box-shadow: 0 6px 24px rgba(0,0,0,.35); z-index: 10; font-size: 12px; }
  .switcher button { color: #fff; font-size: 15px; padding: 0 6px; }
  .switcher .sep { width: 1px; height: 16px; background: #555; }

  /* ---------- Variant A: Arc ---------- */
  .A .panel-shell { background: linear-gradient(170deg, #e9e3f7 0%, #dfe9f6 100%); border-right: 0; }
  :root[data-theme="dark"] .A .panel-shell { background: linear-gradient(170deg, #2b2640 0%, #1f2a38 100%); }
  .A .panel-head { display: none; }
  .A .panel-body { padding: 10px; }
  .A .url { height: 34px; border-radius: 10px; background: rgba(255,255,255,.55); display: flex; align-items: center; padding: 0 12px; color: var(--chrome-muted); margin-bottom: 12px; }
  :root[data-theme="dark"] .A .url { background: rgba(255,255,255,.08); }
  .A .favs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  .A .favs > div { height: 52px; border-radius: 12px; background: rgba(255,255,255,.55); display: grid; place-items: center; position: relative; }
  :root[data-theme="dark"] .A .favs > div { background: rgba(255,255,255,.08); }
  .A .favs > div.live::after { content: ""; position: absolute; bottom: 6px; width: 4px; height: 4px; border-radius: 2px; background: var(--chrome-text); opacity: .5; }
  .A .favs .fav { width: 24px; height: 24px; border-radius: 6px; font-size: 12px; }
  .A .row { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 10px; position: relative; }
  .A .row:hover { background: rgba(255,255,255,.35); }
  .A .row.active { background: rgba(255,255,255,.9); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  :root[data-theme="dark"] .A .row:hover { background: rgba(255,255,255,.06); }
  :root[data-theme="dark"] .A .row.active { background: rgba(255,255,255,.14); }
  .A .row .fav { width: 16px; height: 16px; border-radius: 4px; font-size: 9px; }
  .A .row .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .A .row.closed .t { opacity: .55; }
  .A .row .x { opacity: 0; color: var(--chrome-muted); }
  .A .row:hover .x { opacity: 1; }
  .A .row .sub { color: var(--chrome-muted); }
  .A .reset { color: var(--chrome-muted); font-size: 12px; }
  .A .divider { display: flex; align-items: center; gap: 8px; margin: 10px 4px; color: var(--chrome-muted); font-size: 11px; }
  .A .divider::before { content: ""; flex: 1; height: 1px; background: rgba(0,0,0,.12); order: 1; }
  :root[data-theme="dark"] .A .divider::before { background: rgba(255,255,255,.12); }
  .A .divider .clear { order: 2; }
  .A .newtab { color: var(--chrome-muted); }
  .A .group { border-left: 3px solid; border-radius: 3px; margin: 4px 0 4px 6px; padding-left: 4px; }
  .A .glabel { font-size: 11px; font-weight: 600; padding: 4px 8px; }

  /* ---------- Variant B: Chrome native ---------- */
  .B .panel-shell { background: var(--chrome-tab); }
  .B .panel-head { font-weight: 500; color: var(--chrome-text); font-size: 13px; }
  .B .search { margin: 4px 12px 8px; height: 32px; border-radius: 16px; background: var(--chrome-frame); display: flex; align-items: center; padding: 0 12px; color: var(--chrome-muted); }
  .B .favs { display: flex; gap: 6px; padding: 4px 12px 10px; flex-wrap: wrap; }
  .B .favs > div { width: 36px; height: 36px; border-radius: 18px; display: grid; place-items: center; position: relative; }
  .B .favs > div:hover { background: var(--chrome-frame); }
  .B .favs .fav { width: 20px; height: 20px; border-radius: 4px; font-size: 10px; }
  .B .favs > div.live { background: color-mix(in srgb, var(--g-blue) 14%, transparent); }
  .B .sect { display: flex; align-items: center; gap: 6px; padding: 10px 14px 4px; font-size: 11px; font-weight: 600; color: var(--chrome-muted); text-transform: uppercase; letter-spacing: .04em; }
  .B .sect .act { margin-left: auto; text-transform: none; letter-spacing: 0; color: var(--g-blue); font-weight: 500; }
  .B .row { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 12px; margin: 0 8px; border-radius: 16px; }
  .B .row:hover { background: var(--chrome-frame); }
  .B .row.active { background: color-mix(in srgb, var(--g-blue) 16%, transparent); color: var(--g-blue); font-weight: 500; }
  .B .row .fav { width: 16px; height: 16px; border-radius: 4px; font-size: 9px; }
  .B .row .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .B .row .dot { width: 6px; height: 6px; border-radius: 3px; background: var(--g-blue); }
  .B .row .x { opacity: 0; color: var(--chrome-muted); }
  .B .row:hover .x { opacity: 1; }
  .B .row .sub { color: var(--chrome-muted); font-weight: 400; }
  .B .reset { color: var(--g-blue); font-size: 12px; }
  .B .gchip { display: inline-block; padding: 2px 8px; border-radius: 6px; color: #fff; font-size: 11px; font-weight: 600; }
  :root[data-theme="dark"] .B .gchip { color: #202124; }

  /* ---------- Variant C: hybrid, dense tree ---------- */
  .C .panel-shell { background: color-mix(in srgb, var(--chrome-frame) 55%, var(--chrome-tab)); }
  .C .panel-head { display: none; }
  .C .panel-body { display: flex; flex-direction: column; }
  .C .scroll { flex: 1; overflow: auto; padding: 8px 6px; }
  .C .favs { display: flex; gap: 2px; padding: 2px 4px 8px; border-bottom: 1px solid var(--page-line); margin-bottom: 6px; }
  .C .favs > div { flex: 1; height: 30px; border-radius: 6px; display: grid; place-items: center; position: relative; }
  .C .favs > div:hover { background: var(--chrome-tab); }
  .C .favs > div.live { background: var(--chrome-tab); box-shadow: inset 0 -2px 0 var(--g-blue); }
  .C .favs .fav { width: 16px; height: 16px; border-radius: 4px; font-size: 9px; }
  .C .row { display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 8px; border-radius: 6px; position: relative; }
  .C .row:hover { background: var(--chrome-tab); }
  .C .row.active { background: var(--chrome-tab); box-shadow: 0 0 0 1px var(--page-line); }
  .C .row .fav { width: 14px; height: 14px; border-radius: 3px; font-size: 8px; }
  .C .row .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .C .row.closed .fav { filter: grayscale(1); opacity: .5; }
  .C .row.closed .t { color: var(--chrome-muted); }
  .C .row .x { opacity: 0; color: var(--chrome-muted); }
  .C .row:hover .x { opacity: 1; }
  .C .row .sub { color: var(--chrome-muted); }
  .C .reset { color: var(--chrome-muted); }
  .C .guide { border-left: 1px solid var(--page-line); margin-left: 15px; padding-left: 4px; }
  .C .today { display: flex; align-items: center; justify-content: space-between; margin: 10px 8px 4px; font-size: 11px; color: var(--chrome-muted); }
  .C .glabel { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; font-size: 11px; font-weight: 600; }
  .C .glabel .bar { width: 10px; height: 10px; border-radius: 3px; }
  .C .bottom { border-top: 1px solid var(--page-line); padding: 8px; display: flex; gap: 6px; flex: none; }
  .C .bottom .search { flex: 1; height: 28px; border-radius: 6px; background: var(--chrome-tab); display: flex; align-items: center; padding: 0 10px; color: var(--chrome-muted); }
  .C .bottom .plus { width: 28px; height: 28px; border-radius: 6px; background: var(--chrome-tab); display: grid; place-items: center; }
</style>
</head>
<body>
<div class="window" id="app">
  <div class="strip" id="strip"></div>
  <div class="toolbar"><span>←</span><span>→</span><span>↻</span><div class="omnibox" id="omni"></div><span>⋮</span></div>
  <div class="main">
    <div class="panel-shell">
      <div class="panel-head"><span>Sidearc</span><span>✕</span></div>
      <div class="panel-body" id="panel"></div>
    </div>
    <div class="page"><h1 id="pagetitle"></h1><div class="line" style="width:70%"></div><div class="line" style="width:90%"></div><div class="line" style="width:55%"></div><div class="line" style="width:80%"></div></div>
  </div>
</div>
<div class="switcher">
  <button id="prev" title="Variante précédente (←)">‹</button>
  <span id="label"></span>
  <button id="next" title="Variante suivante (→)">›</button>
  <span class="sep"></span>
  <button id="theme" title="Clair / sombre">◐</button>
</div>

<script>
// In-memory sample data. Each Favorite and Pinned item is a saved URL; `live` means its tab is open.
const favorites = [
  { id: 'f1', title: 'Gmail', c: '#ea4335', live: true },
  { id: 'f2', title: 'Agenda', c: '#4285f4', live: true },
  { id: 'f3', title: 'Slack', c: '#611f69', live: false },
  { id: 'f4', title: 'GitLab', c: '#fc6d26', live: true },
  { id: 'f5', title: 'Notion', c: '#37352f', live: false },
  { id: 'f6', title: 'ChatGPT', c: '#10a37f', live: false },
];
const pinned = [
  { id: 'p1', title: 'Jira — Tableau', c: '#2684ff', live: true, drift: 'PLAT-1423 · Fix login' },
  { id: 'p2', folder: true, title: 'Monitoring', open: true, children: [
    { id: 'p3', title: 'Grafana — Prod', c: '#f46800', live: true },
    { id: 'p4', title: 'Bugsnag', c: '#4949e4', live: false },
    { id: 'p5', title: 'AWS Console', c: '#ff9900', live: false },
  ]},
  { id: 'p6', folder: true, title: 'Docs', open: false, children: [
    { id: 'p7', title: 'Runbooks', c: '#5f6368', live: false },
  ]},
  { id: 'p8', folder: true, title: 'Clients', open: true, children: [
    { id: 'p9', folder: true, title: 'Valeo', open: false, children: [] },
    { id: 'p10', title: 'Notion — Roadmap', c: '#37352f', live: false },
  ]},
  { id: 'p11', title: 'Redmine', c: '#b32024', live: false },
];
const today = [
  { id: 't1', title: 'chrome.sidePanel — Chrome for Developers', c: '#1a73e8' },
  { group: true, id: 'g1', title: 'Sidearc', color: 'blue', collapsed: false, tabs: [
    { id: 't2', title: 'Entrypoints — WXT', c: '#67d55e' },
    { id: 't3', title: 'Pragmatic drag and drop', c: '#0c66e4' },
  ]},
  { id: 't4', title: 'nisargkolhe/arcify · GitHub', c: '#24292f' },
  { group: true, id: 'g2', title: 'Lecture', color: 'orange', collapsed: true, tabs: [
    { id: 't5', title: 'Article 1', c: '#888' }, { id: 't6', title: 'Article 2', c: '#888' }, { id: 't7', title: 'Article 3', c: '#888' },
  ]},
  { id: 't8', title: 'YouTube', c: '#ff0000' },
];
const variants = { A: 'Arc', B: 'Chrome natif', C: 'Hybride compact' };
let active = 't1';

const params = new URLSearchParams(location.search);
let variant = variants[params.get('variant')] ? params.get('variant') : 'A';
const groupColor = g => `var(--g-${g})`;
const fav = (it, cls = '') => `<span class="fav ${cls}" style="background:${it.c}">${it.title[0]}</span>`;
const allItems = () => {
  const out = [];
  const walk = l => l.forEach(i => i.folder ? walk(i.children) : out.push(i));
  walk(pinned); favorites.forEach(f => out.push(f));
  today.forEach(t => t.group ? t.tabs.forEach(x => out.push(x)) : out.push(t));
  return out;
};

// Row text for a Pinned item whose tab navigated away: saved title, then the current page, then reset.
function titleHtml(it, sep) {
  if (!it.drift || !it.live) return `<span class="t">${it.title}</span>`;
  return `<span class="t">${it.title} <span class="sub">${sep} ${it.drift}</span></span><button class="reset" title="Revenir à l'URL sauvée">↺</button>`;
}

function renderA() {
  const pin = (l, depth) => l.map(it => it.folder
    ? `<div class="row" data-folder="${it.id}" style="padding-left:${10 + depth * 16}px"><span>${it.open ? '▾' : '▸'}</span><span class="t">📁 ${it.title}</span></div>${it.open ? pin(it.children, depth + 1) : ''}`
    : `<div class="row ${it.live ? '' : 'closed'} ${active === it.id ? 'active' : ''}" data-id="${it.id}" style="padding-left:${10 + depth * 16}px">${fav(it)}${titleHtml(it, '/')}${it.live ? '<span class="x">−</span>' : ''}</div>`).join('');
  const tab = t => `<div class="row ${active === t.id ? 'active' : ''}" data-id="${t.id}">${fav(t)}<span class="t">${t.title}</span><span class="x">✕</span></div>`;
  return `<div class="url">sidepanel API chrome extension</div>
    <div class="favs">${favorites.map(f => `<div class="${f.live ? 'live' : ''}" data-id="${f.id}" title="${f.title}">${fav(f)}</div>`).join('')}</div>
    ${pin(pinned, 0)}
    <div class="divider"><button class="clear">↓ Clear</button></div>
    <div class="row newtab">＋ <span class="t">Nouvel onglet</span></div>
    ${today.map(t => t.group
      ? `<div class="group" style="border-color:${groupColor(t.color)}"><div class="glabel" data-group="${t.id}" style="color:${groupColor(t.color)}">${t.collapsed ? '▸' : '▾'} ${t.title}${t.collapsed ? ` · ${t.tabs.length}` : ''}</div>${t.collapsed ? '' : t.tabs.map(tab).join('')}</div>`
      : tab(t)).join('')}`;
}

function renderB() {
  const pin = (l, depth) => l.map(it => it.folder
    ? `<div class="row" data-folder="${it.id}" style="padding-left:${12 + depth * 18}px"><span style="color:var(--chrome-muted)">${it.open ? '▾' : '▸'}</span><span class="t">${it.title}</span></div>${it.open ? pin(it.children, depth + 1) : ''}`
    : `<div class="row ${active === it.id ? 'active' : ''}" data-id="${it.id}" style="padding-left:${12 + depth * 18}px">${fav(it)}${titleHtml(it, '›')}${it.live ? '<span class="dot" title="Onglet ouvert"></span>' : ''}</div>`).join('');
  const tab = t => `<div class="row ${active === t.id ? 'active' : ''}" data-id="${t.id}">${fav(t)}<span class="t">${t.title}</span><span class="x">✕</span></div>`;
  return `<div class="search">🔍 Rechercher dans les onglets et favoris</div>
    <div class="sect">Favoris</div>
    <div class="favs">${favorites.map(f => `<div class="${f.live ? 'live' : ''}" data-id="${f.id}" title="${f.title}">${fav(f)}</div>`).join('')}</div>
    <div class="sect">Épinglés <span class="act">＋ Dossier</span></div>
    ${pin(pinned, 0)}
    <div class="sect">Onglets <span class="act">Tout fermer</span></div>
    ${today.map(t => t.group
      ? `<div class="row" data-group="${t.id}"><span style="color:var(--chrome-muted)">${t.collapsed ? '▸' : '▾'}</span><span class="gchip" style="background:${groupColor(t.color)}">${t.title}</span>${t.collapsed ? `<span class="sub">${t.tabs.length} onglets</span>` : ''}</div>${t.collapsed ? '' : t.tabs.map(x => tab(x).replace('class="row', 'style="padding-left:40px" class="row')).join('')}`
      : tab(t)).join('')}`;
}

function renderC() {
  const pin = l => l.map(it => it.folder
    ? `<div class="row" data-folder="${it.id}"><span class="sub">${it.open ? '▾' : '▸'}</span><span class="t">${it.title}</span><span class="sub">${it.children.length || ''}</span></div>${it.open ? `<div class="guide">${pin(it.children)}</div>` : ''}`
    : `<div class="row ${it.live ? '' : 'closed'} ${active === it.id ? 'active' : ''}" data-id="${it.id}">${fav(it)}${titleHtml(it, '›')}${it.live ? '<span class="x">−</span>' : ''}</div>`).join('');
  const tab = t => `<div class="row ${active === t.id ? 'active' : ''}" data-id="${t.id}">${fav(t)}<span class="t">${t.title}</span><span class="x">✕</span></div>`;
  return `<div class="scroll">
      <div class="favs">${favorites.map(f => `<div class="${f.live ? 'live' : ''}" data-id="${f.id}" title="${f.title}">${fav(f)}</div>`).join('')}</div>
      ${pin(pinned)}
      <div class="today"><span>Today</span><button>Clear</button></div>
      ${today.map(t => t.group
        ? `<div class="glabel" data-group="${t.id}"><span class="bar" style="background:${groupColor(t.color)}"></span>${t.title}<span class="sub" style="font-weight:400">${t.collapsed ? t.tabs.length : ''}</span></div>${t.collapsed ? '' : `<div class="guide" style="border-color:${groupColor(t.color)}">${t.tabs.map(tab).join('')}</div>`}`
        : tab(t)).join('')}
    </div>
    <div class="bottom"><div class="search">🔍 Rechercher</div><div class="plus">＋</div></div>`;
}

// Mock Chrome tab strip: open favorites and pinned items, then the other tabs, as Chrome would show them.
function renderStrip() {
  const live = allItems().filter(i => i.live && !i.group);
  const tabs = live.map(i => `<div class="stab ${active === i.id ? 'active' : ''}">${fav(i).replace('class="fav ', 'class="fav " style="width:14px;height:14px;border-radius:3px;font-size:8px;background:' + i.c + '"')}${i.title}</div>`);
  today.forEach(t => {
    if (t.group) {
      tabs.push(`<div class="stab" style="width:auto"><span class="chip" style="background:${groupColor(t.color)}">${t.title}</span></div>`);
      if (!t.collapsed) t.tabs.forEach(x => tabs.push(`<div class="stab ${active === x.id ? 'active' : ''}">${x.title}</div>`));
    } else tabs.push(`<div class="stab ${active === t.id ? 'active' : ''}">${t.title}</div>`);
  });
  document.getElementById('strip').innerHTML = tabs.join('');
}

function render() {
  document.getElementById('app').className = 'window ' + variant;
  document.getElementById('panel').innerHTML = { A: renderA, B: renderB, C: renderC }[variant]();
  document.getElementById('label').textContent = `${variant} (${variants[variant]})`;
  const cur = allItems().find(i => i.id === active);
  document.getElementById('pagetitle').textContent = cur ? (cur.drift && cur.live ? cur.drift : cur.title) : '';
  document.getElementById('omni').textContent = cur ? cur.title.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.example.com' : '';
  renderStrip();
}

function find(list, id) {
  for (const it of list) {
    if (it.id === id) return it;
    if (it.children) { const f = find(it.children, id); if (f) return f; }
  }
}

document.getElementById('panel').addEventListener('click', e => {
  const reset = e.target.closest('.reset');
  const row = e.target.closest('[data-id],[data-folder],[data-group]');
  if (!row) return;
  if (reset) { const it = allItems().find(i => i.id === row.dataset.id); delete it.drift; }
  else if (row.dataset.folder) { const f = find(pinned, row.dataset.folder); f.open = !f.open; }
  else if (row.dataset.group) { const g = today.find(t => t.id === row.dataset.group); g.collapsed = !g.collapsed; }
  else {
    const it = allItems().find(i => i.id === row.dataset.id);
    if (e.target.closest('.x')) { if ('live' in it) it.live = false; }
    else { if ('live' in it) it.live = true; active = it.id; }
  }
  render();
});

function cycle(step) {
  const keys = Object.keys(variants);
  variant = keys[(keys.indexOf(variant) + step + keys.length) % keys.length];
  render();
  // A data: or sandboxed copy of the page refuses URL changes.
  try { history.replaceState(null, '', '?variant=' + variant); } catch {}
}
document.getElementById('prev').onclick = () => cycle(-1);
document.getElementById('next').onclick = () => cycle(1);
document.getElementById('theme').onclick = () => {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
};
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});
if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
render();
</script>
</body>
</html>
